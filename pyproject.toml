[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ergon-tracker"
version = "0.1.0"
description = "Unified, reliable, typed job-fetching SDK that combines and canonicalizes free job sources (ATS feeds + aggregators)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kanagn", email = "kwnstantinosanagn@gmail.com" }]
keywords = ["jobs", "ats", "greenhouse", "lever", "ashby", "workday", "scraping", "aggregator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
# UPPER BOUNDS ARE DELIBERATE. Every floor below was written once and then left to drift; by
# 2026-09 four deps had silently crossed a MAJOR (stamina 24->26, hishel 0.x->1.x, rich 13->15,
# mcp 1->2) and only the local .venv's install date kept CI green. mcp 2.0 finally broke it for
# real (FastMCP -> MCPServer), and because nothing pinned it the breakage was invisible until a
# fresh resolve. A `<next-major` cap turns "silent rot" into "a deliberate, reviewable bump".
# Raise a cap when you migrate, not before.
dependencies = [
  "httpx[http2]>=0.27,<1",
  "anyio>=4.3,<5",
  "aiolimiter>=1.1,<2",
  "stamina>=24.2",          # CalVer (YY.MINOR) — a numeric cap would block next year's release
  "pydantic>=2.6,<3",
  "hishel>=0.0.30,<2",
  "selectolax>=0.3.21,<1",
  "curl_cffi>=0.7,<1",
  "rapidfuzz>=3.6,<4",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
polars = ["polars>=0.20"]
# mcp 2.x renamed FastMCP -> MCPServer and moved mcp.server.fastmcp -> mcp.server.mcpserver.
# mcp_server.py targets the 2.x API, so 2.2 is a hard floor; <3 so the next rename is a choice.
mcp = ["mcp>=2.2,<3"]
semantic = ["fastembed>=0.3"]
# HTTP QUERY (RFC 10008) search surface — only needed to RUN the server (ergon_tracker.serve.serve);
# the ASGI app itself is dependency-light and testable in-process via httpx (a core dep).
serve = ["uvicorn>=0.30"]
# Offline-only: the Tier-2 token-mint shell (scripts/token_mint.py). Never on the runtime/request path.
browser = ["playwright>=1.40"]
# Offline-only: training the sector classifier (scripts/train_sector_classifier.py). Never at runtime.
sector-train = ["scikit-learn>=1.4", "numpy>=1.26"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "vcrpy>=6",
  "pytest-cov",
  "ruff==0.15.17",  # PINNED: a floating ruff reformats across versions -> CI format-check drift (was red for days). Bump deliberately.
  "mypy==2.1.0",    # PINNED for the same reproducibility reason: a floating type-checker surprises CI with new errors.
  "openpyxl>=3.1",
  "numpy>=1.26",
  "pip-audit>=2.7",  # local `pip-audit` — same known-CVE scan the CI `audit` job runs
  "pre-commit>=3.7", # local gates: `pre-commit install` once, see .pre-commit-config.yaml
]

[project.urls]
Homepage = "https://github.com/konstantinosanagn/ergon-tracker"
Source = "https://github.com/konstantinosanagn/ergon-tracker"

[project.scripts]
ergon-tracker = "ergon_tracker.cli:app"
ergon-tracker-mcp = "ergon_tracker.mcp_server:main"

# Third-party providers register here:
# [project.entry-points."ergon_tracker.providers"]
# myats = "my_pkg.provider:MyATSProvider"

[tool.hatch.build.targets.wheel]
# All data files (registry/data/*.json, index/schema.sql) are git-tracked and live INSIDE the
# package dir, so `packages` already ships them. A force-include remapping the same paths would
# double-add them and fail the wheel build ("A second file is being added at the same path").
packages = ["src/ergon_tracker"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument return sentinel objects (not mutable defaults); they are the
# idiomatic way to declare CLI params, so don't flag them under B008.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/ergon_tracker"]

# numpy's bundled stubs (pulled in via pandas/polars) use PEP 695 `type` statements that mypy
# rejects under python_version 3.10, breaking CI on the 3.12/3.13 matrix. We don't type-check
# numpy internals — skip following into it.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = ["."]
