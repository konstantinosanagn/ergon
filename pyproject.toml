[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ergon"
version = "0.1.0"
description = "Unified, reliable, typed job-fetching SDK that combines and canonicalizes free job sources (ATS feeds + aggregators)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kanagn", email = "kwnstantinosanagn@gmail.com" }]
keywords = ["jobs", "ats", "greenhouse", "lever", "ashby", "workday", "scraping", "aggregator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
# Upper bounds are deliberate: bare floors let four deps cross a major unnoticed.
# Raise a cap when you migrate, not before.
dependencies = [
  "httpx[http2]>=0.27,<1",
  "anyio>=4.15.1,<5",
  "aiolimiter>=1.1,<2",
  "stamina>=24.2",          # CalVer — a numeric cap would block next year's release
  "pydantic>=2.13.5,<3",
  "hishel>=1.3.1,<2",
  "selectolax>=0.4.11,<1",
  "curl_cffi>=0.16.3,<1",
  "rapidfuzz>=3.6,<4",
  "typer>=0.27.2,<1",
  "rich>=13.7,<16",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
polars = ["polars>=1.44.1"]
mcp = ["mcp>=2.2,<3"]  # 2.x renamed FastMCP -> MCPServer
semantic = ["fastembed>=0.3"]
# HTTP QUERY (RFC 10008) search surface — only needed to RUN the server (ergon.serve.serve);
# the ASGI app itself is dependency-light and testable in-process via httpx (a core dep).
serve = ["uvicorn>=0.52.4"]
# Offline-only: the Tier-2 token-mint shell (scripts/token_mint.py). Never on the runtime/request path.
browser = ["playwright>=1.62.0"]
# Offline-only: training the sector classifier (scripts/train_sector_classifier.py). Never at runtime.
sector-train = ["scikit-learn>=1.4", "numpy>=1.26"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "vcrpy>=8.3.0",
  "pytest-cov",
  "ruff==0.16.6",  # PINNED: a floating ruff reformats across versions -> CI format-check drift (was red for days). Bump deliberately.
  "mypy==2.3.1",    # PINNED for the same reproducibility reason: a floating type-checker surprises CI with new errors.
  "openpyxl>=3.1",
  "numpy>=1.26",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/konstantinosanagn/ergon"
Source = "https://github.com/konstantinosanagn/ergon"

[project.scripts]
ergon = "ergon.cli:app"
ergon-mcp = "ergon.mcp_server:main"

# Third-party providers register here:
# [project.entry-points."ergon.providers"]
# myats = "my_pkg.provider:MyATSProvider"

[tool.hatch.build.targets.wheel]
# All data files (registry/data/*.json, index/schema.sql) are git-tracked and live INSIDE the
# package dir, so `packages` already ships them. A force-include remapping the same paths would
# double-add them and fail the wheel build ("A second file is being added at the same path").
packages = ["src/ergon"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument return sentinel objects (not mutable defaults); they are the
# idiomatic way to declare CLI params, so don't flag them under B008.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/ergon"]

# numpy's bundled stubs (pulled in via pandas/polars) use PEP 695 `type` statements that mypy
# rejects under python_version 3.10, breaking CI on the 3.12/3.13 matrix. We don't type-check
# numpy internals — skip following into it.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = ["."]
