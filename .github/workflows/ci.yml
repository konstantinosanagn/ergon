name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches dependency drift in quiet periods; push/PR alone can go months.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev,pandas,polars,mcp]"
      # mypy covers src/ only; scripts/ needs ~470 annotations first.
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format check
        run: uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=ergon --cov-report=term-missing

  # Known-CVE scan (PyPI Advisory DB + OSV).
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv
      - name: Install (runtime + optional extras, so extras are audited too)
        run: uv pip install -e ".[mcp,pandas,polars]"
      - name: pip-audit
        run: |
          uv pip install pip-audit
          # No --strict: it also fails on unauditable packages, and this project is
          # unpublished. Still fails on any known advisory. Accept a finding with
          # --ignore-vuln GHSA-xxxx, never by silencing the step.
          uv run pip-audit --progress-spinner off
