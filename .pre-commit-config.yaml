# Setup: uv pip install pre-commit && pre-commit install
# Tool versions must match pyproject.toml [dev] — a floating formatter causes CI drift.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        files: ^\.github/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=6000] # largest legitimate file is seed.json at 5.3MB

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^src/ergon/
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - pydantic>=2.6
          - types-requests

  - repo: local
    hooks:
      - id: no-tracked-docs
        name: docs must not be tracked (only mcp-quickstart.md)
        entry: bash -c 'l=$(git ls-files docs | grep -v "^docs/mcp-quickstart.md$" || true); [ -z "$l" ] || { echo "tracked docs:"; echo "$l"; echo "untrack: git rm --cached <path>"; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
